spring:
  
  docker:
    compose:
      enabled: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health, beans, env, mappings, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.remindledger: DEBUG

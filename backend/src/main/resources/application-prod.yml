# Activated when SPRING_PROFILES_ACTIVE=prod in the selected container runtime.
# Base application.yml still applies: Flyway runs on startup, OAuth2 resource server, ddl-auto validate.

spring:

  docker:
    compose:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
